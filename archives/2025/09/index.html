<div id="chatbot-button" onclick="toggleChat()">🤖</div>

<div id="chatbot-container">
  <div id="chatbot-header">
    AI 聊天助手
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⤢</button>
  </div>

    <input id="chatbot-input" type="text" placeholder="输入消息..." onkeydown="handleKeyDown(event)">
    <div class="input-hint">💡 API价格高，请勿滥用</div>
    <div class="input-actions">
      <button id="chatbot-send" onclick="sendMessage()">➤</button>
      <button id="chatbot-clear" onclick="clearAllMessages()">🧹</button>
    </div>
  </div>

<script>
let chatHistory = [];

window.addEventListener("load", () => {
  const savedMessages = localStorage.getItem("chatbot_messages");
  if (savedMessages) {
    try {
      const messages = JSON.parse(savedMessages);
      messages.forEach(msg => addMessage(msg.text, msg.role));
    } catch (e) {}
  }

  const savedHistory = localStorage.getItem("chatbot_history");
  if (savedHistory) {
    try {
      chatHistory = JSON.parse(savedHistory);
    } catch (e) {}
  }
});

function toggleChat() {
  var container = document.getElementById("chatbot-container");

  if (!container) return;

  const isVisible = window.getComputedStyle(container).display !== "none";

  if (isVisible) {
    container.classList.remove("show");
    setTimeout(() => {
      container.style.display = "none";
    }, 400);
  } else {
    container.style.display = "flex";
    setTimeout(() => {
      container.classList.add("show");
    }, 10);
  }
}

function handleKeyDown(e) {
  const input = document.getElementById("chatbot-input");
  if (e.key === 'Enter' && e.shiftKey) {
    const start = input.selectionStart;
    const end = input.selectionEnd;
    input.setRangeText('\n', start, end, 'end');
    e.preventDefault();
  } else if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const input = document.getElementById("chatbot-input");
  const messages = document.getElementById("chatbot-messages");

  const userMessage = input.value.trim();
  if (!userMessage) return;

  addMessage(userMessage, 'user');

  const typingDiv = document.createElement('div');
  typingDiv.className = 'message bot typing-indicator';
  typingDiv.textContent = '正在思考...';
  messages.appendChild(typingDiv);

  chatHistory.push({ role: "user", content: userMessage });
  saveHistoryToLocalStorage();

  try {
    const response = await fetch('https://free.v36.cm/v1/chat/completions',  {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer sk-Lb975ni0OqDsiOMX10BaE1194bC34e01A0B39dB92cE3E190'
      },
      body: JSON.stringify({
        model: "gpt-3.5-turbo",
        messages: chatHistory
      })
    });

    const data = await response.json();
    const reply = data.choices?.[0]?.message?.content || '出错了';

    if (typingDiv) typingDiv.remove();

    addMessage(reply, 'bot');
    chatHistory.push({ role: "assistant", content: reply });
    saveHistoryToLocalStorage();
    autoScrollToBottom();

  } catch (e) {
    if (typingDiv) typingDiv.remove();

    const errorDiv = document.createElement('div');
    errorDiv.className = 'message bot';
    errorDiv.innerHTML = marked.parse('请求失败: ' + e.message);
    document.getElementById("chatbot-messages").appendChild(errorDiv);
    autoScrollToBottom();

    console.error("请求失败:", e);
  }
}

function clearAllMessages() {
  const messagesContainer = document.getElementById("chatbot-messages");
  messagesContainer.innerHTML = "";
  chatHistory = [];
  localStorage.removeItem("chatbot_history");
  localStorage.removeItem("chatbot_messages");
}

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  div.innerHTML = marked.parse(text);
  div.setAttribute('contenteditable', role === 'user' ? 'true' : 'false');

  // 创建按钮容器
  const buttonsDiv = document.createElement('div');
  buttonsDiv.className = 'message-buttons';

  if (role === 'user') {
    const editBtn = document.createElement('button');
    editBtn.textContent = '✏️ 编辑';
    editBtn.onclick = () => enableEdit(div);
    buttonsDiv.appendChild(editBtn);
  }

  if (role === 'bot') {
    const regenBtn = document.createElement('button');
    regenBtn.textContent = '🔄 重新生成';
    regenBtn.onclick = () => regenerateResponse(div);
    buttonsDiv.appendChild(regenBtn);
  }

  div.appendChild(buttonsDiv);
  document.getElementById("chatbot-messages").appendChild(div);
  hljs.highlightAll();
  renderMathInElement(div);
  autoScrollToBottom();
}

function enableEdit(element) {
  element.contentEditable = true;
  element.focus();

  element.onkeydown = function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const newContent = element.innerText.trim();
      updateMessage(element, newContent);
    }
  };
}

function updateMessage(element, newContent) {
  element.innerText = newContent;
  element.contentEditable = false;
  element.onkeydown = null;

  const index = Array.from(document.querySelectorAll(".user")).indexOf(element);
  if (index !== -1) {
    chatHistory[index * 2] = { role: "user", content: newContent };
    saveHistoryToLocalStorage();
  }

  // 重新插入编辑按钮
  const oldButtons = element.querySelector('.message-buttons');
  if (oldButtons) oldButtons.remove();

  const buttonsDiv = document.createElement('div');
  buttonsDiv.className = 'message-buttons';

  const editBtn = document.createElement('button');
  editBtn.textContent = '✏️ 编辑';
  editBtn.onclick = () => enableEdit(element);
  buttonsDiv.appendChild(editBtn);

  element.appendChild(buttonsDiv);
}

function regenerateResponse(botMessageDiv) {
  const messagesContainer = document.getElementById("chatbot-messages");
  const botMessages = Array.from(messagesContainer.querySelectorAll('.bot'));
  const index = botMessages.indexOf(botMessageDiv);

  if (index >= 0 && index < botMessages.length) {
    const userMessage = chatHistory[index * 2]?.content;

    if (userMessage) {
      botMessageDiv.remove();
      chatHistory.splice(index * 2 + 1, 1);
      saveHistoryToLocalStorage();

      fetchAIReply(userMessage, index);
    }
  }
}

async function fetchAIReply(userMessage, index) {
  const messagesContainer = document.getElementById("chatbot-messages");

  const typingDiv = document.createElement('div');
  typingDiv.className = 'message bot typing-indicator';
  typingDiv.textContent = '正在思考...';
  messagesContainer.appendChild(typingDiv);

  try {
    const response = await fetch('https://free.v36.cm/v1/chat/completions',  {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer sk-65Xzq3XlGvUQcfl0D4CeAf2a74Ad4c5dBc5206Fc5541E117'
      },
      body: JSON.stringify({
        model: "gpt-3.5-turbo",
        messages: [{ role: "user", content: userMessage }]
      })
    });

    const data = await response.json();
    const reply = data.choices?.[0]?.message?.content || '出错了';

    if (typingDiv) typingDiv.remove();

    const replyDiv = document.createElement('div');
    replyDiv.className = 'message bot';
    replyDiv.innerHTML = marked.parse(reply);
    messagesContainer.appendChild(replyDiv);

    hljs.highlightAll();
    renderMathInElement(replyDiv);
    addCopyButtonsToCodeBlocks(replyDiv);
    chatHistory.push({ role: "assistant", content: reply });
    saveHistoryToLocalStorage();
    autoScrollToBottom();

  } catch (e) {
    console.error("重新生成失败:", e);
  }
}

function renderMathInElement(element) {
  if (typeof katex !== 'undefined') {
    katex.renderMathInElement(element, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false }
      ]
    });
  }
}

function addCopyButtonsToCodeBlocks(container) {
  const codeBlocks = container.querySelectorAll('pre code');
  codeBlocks.forEach(code => {
    if (!code.parentNode.querySelector('.code-copy-btn')) {
      const button = document.createElement('button');
      button.className = 'code-copy-btn';
      button.type = 'button';
      button.textContent = '📋 复制';

      button.addEventListener('click', () => {
        navigator.clipboard.writeText(code.textContent).then(() => {
          button.textContent = '✅ 已复制!';
          setTimeout(() => button.textContent = '📋 复制', 2000);
        }).catch(err => {
          console.error('复制失败:', err);
        });
      });

      code.parentNode.appendChild(button);
    }
  });
}

function addDownloadButtonToCodeBlocks(container) {
  const codeBlocks = container.querySelectorAll('pre code');
  codeBlocks.forEach(code => {
    if (!code.parentNode.querySelector('.code-download-btn')) {
      const button = document.createElement('button');
      button.className = 'code-download-btn';
      button.type = 'button';
      button.textContent = '💾 下载';

      button.addEventListener('click', () => {
        const blob = new Blob([code.textContent], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ai-code.txt';
        a.click();
        URL.revokeObjectURL(url);
      });

      code.parentNode.appendChild(button);
    }
  });
}

function autoScrollToBottom() {
  const messages = document.getElementById("chatbot-messages");
  messages.scrollTop = messages.scrollHeight;
}

function saveHistoryToLocalStorage() {
  localStorage.setItem("chatbot_history", JSON.stringify(chatHistory));
}

function toggleFullscreen() {
  const container = document.getElementById("chatbot-container");
  if (!container) return;

  if (!document.fullscreenElement) {
    container.requestFullscreen().catch(err => {
      alert("无法进入全屏：" + err.message);
    });
  } else {
    document.exitFullscreen();
  }
}
